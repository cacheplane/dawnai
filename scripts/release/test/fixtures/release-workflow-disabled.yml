          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
      - name: Download exact runtime inputs by ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.hydrate.outputs.artifact_id }}
          path: ${{ runner.temp }}/runtime
      - name: Download audit dispatch receipt by ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.dispatch-audit.outputs.dispatch_artifact_id }}
          path: ${{ runner.temp }}/dispatch
      - name: Record exact audit dispatch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/release/cli.mjs record-audit-dispatch \
            --candidate "$RUNNER_TEMP/runtime/candidate.json" \
            --dispatch-result "$RUNNER_TEMP/dispatch/audit-dispatch.json"

  correlate-audit:
    needs:
      - detect
      - hydrate
      - record-audit-dispatch
      - tag
    if: >-
      always() &&
      needs.hydrate.result == 'success' &&
      needs.tag.result == 'success' &&
      needs.tag.outputs.continue == 'true' &&
      github.ref == format('refs/tags/v{0}', inputs.version) &&
      github.sha == needs.detect.outputs.candidate_sha &&
      inputs.version == needs.detect.outputs.candidate_version &&
      inputs.commitSha == needs.detect.outputs.candidate_sha &&
      inputs.operation == 'reconcile' &&
      contains(fromJSON('["prepare-artifacts","attest-artifacts","escrow-candidate","publish-npm-packages","resume-npm-publish","reconcile-npm-evidence","run-release-smokes","reconcile-smoke-evidence","dispatch-release-audit","complete-release-audit"]'), needs.detect.outputs.next_transition) &&
      (needs.detect.outputs.next_transition == 'complete-release-audit' || needs.record-audit-dispatch.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      actions: read
      contents: write
    outputs:
      audit_artifact_id: ${{ steps.audit-result.outputs.artifact-id }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.detect.outputs.candidate_sha }}
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
      - name: Download exact runtime inputs by ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.hydrate.outputs.artifact_id }}
          path: ${{ runner.temp }}/runtime
      - name: Download new audit dispatch receipt by ID
        if: ${{ needs.detect.outputs.next_transition != 'complete-release-audit' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.record-audit-dispatch.outputs.dispatch_artifact_id }}
          path: ${{ runner.temp }}/new-dispatch
      - name: Select new audit dispatch receipt
        if: ${{ needs.detect.outputs.next_transition != 'complete-release-audit' }}
        run: cp -- "$RUNNER_TEMP/new-dispatch/audit-dispatch.json" "$RUNNER_TEMP/runtime/audit-dispatch.json"
      - name: Wait for the exact audit run
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/release/cli.mjs wait-audit \
            --candidate "$RUNNER_TEMP/runtime/candidate.json" \
            --dispatch-result "$RUNNER_TEMP/runtime/audit-dispatch.json" \
            --output "$RUNNER_TEMP/audit-result.json"
      - name: Correlate and attach exact audit result
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/release/cli.mjs correlate-audit \
            --candidate "$RUNNER_TEMP/runtime/candidate.json" \
            --dispatch-result "$RUNNER_TEMP/runtime/audit-dispatch.json" \
            --audit-result "$RUNNER_TEMP/audit-result.json"
      - name: Upload exact correlated audit result
        id: audit-result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: correlated-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/audit-result.json
          if-no-files-found: error
          overwrite: false
      - name: Require successful independent audit
        run: node -e 'const r=require(process.argv[1]);if(r.conclusion!=="success")process.exit(1)' "$RUNNER_TEMP/audit-result.json"

  publish-release:
    needs:
      - correlate-audit
      - detect
      - hydrate
      - tag
    if: >-
      always() &&
      needs.hydrate.result == 'success' &&
      needs.tag.result == 'success' &&
      needs.tag.outputs.continue == 'true' &&
      github.ref == format('refs/tags/v{0}', inputs.version) &&
      github.sha == needs.detect.outputs.candidate_sha &&
      inputs.version == needs.detect.outputs.candidate_version &&
      inputs.commitSha == needs.detect.outputs.candidate_sha &&
      inputs.operation == 'reconcile' &&
      contains(fromJSON('["prepare-artifacts","attest-artifacts","escrow-candidate","publish-npm-packages","resume-npm-publish","reconcile-npm-evidence","run-release-smokes","reconcile-smoke-evidence","dispatch-release-audit","complete-release-audit","publish-github-release"]'), needs.detect.outputs.next_transition) &&
      (needs.detect.outputs.next_transition == 'publish-github-release' || needs.correlate-audit.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.detect.outputs.candidate_sha }}
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
      - name: Download exact runtime inputs by ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.hydrate.outputs.artifact_id }}
          path: ${{ runner.temp }}/runtime
      - name: Download newly correlated audit by ID
        if: ${{ needs.detect.outputs.next_transition != 'publish-github-release' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.correlate-audit.outputs.audit_artifact_id }}
          path: ${{ runner.temp }}/new-audit
      - name: Select newly correlated audit result
        if: ${{ needs.detect.outputs.next_transition != 'publish-github-release' }}
        run: cp -- "$RUNNER_TEMP/new-audit/audit-result.json" "$RUNNER_TEMP/runtime/audit-result.json"
      - name: Publish one immutable consolidated Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/release/cli.mjs publish-release \
            --candidate "$RUNNER_TEMP/runtime/candidate.json" \
            --record "$RUNNER_TEMP/runtime/release-record.json" \
            --audit-result "$RUNNER_TEMP/runtime/audit-result.json"
