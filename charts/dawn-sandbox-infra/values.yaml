# Default values for dawn-sandbox-infra.
# This chart provisions the cluster-side infrastructure the Dawn
# kubernetesSandbox provider (@dawn-ai/sandbox) assumes: a namespace,
# least-privilege RBAC for the orchestrator, a default-deny egress
# NetworkPolicy backstop, a ResourceQuota + LimitRange (cpu/memory/
# ephemeral-storage), configurable Pod Security Standards, and a
# self-bookkeeping PVC reaper. (PID limits are node-level on K8s — see README.)
# Sandbox operation requires dynamic RWO volume provisioning and Pod Security
# Admission. NetworkPolicy enforcement additionally requires a policy-enforcing
# CNI; creating NetworkPolicy objects is not itself enforcement.

namespace:
  # create: whether the chart creates the namespace. Set to false to
  # install into a namespace that already exists (e.g. managed elsewhere).
  create: true
  # name: the namespace the provider's `opts.namespace` must match.
  name: dawn-sandboxes
  # extraLabels: additional namespace labels. All pod-security.kubernetes.io/*
  # keys plus helm.sh/chart, app.kubernetes.io/name,
  # app.kubernetes.io/instance, and app.kubernetes.io/managed-by are reserved
  # and rejected by the namespace template.
  extraLabels: {}

podSecurityStandard:
  # Restricted is the default. Workloads that intentionally opt out of the
  # provider's restricted-compatible hardening must explicitly set baseline;
  # the chart never downgrades automatically.
  # enforce: baseline | restricted | privileged
  enforce: restricted
  warn: restricted
  audit: restricted
  # version: the PSS policy version to pin the enforce/warn/audit labels to.
  # "latest" always applies the newest rules (may tighten on a cluster upgrade);
  # pin to e.g. "v1.31" for stability against silent drift across upgrades.
  version: latest

orchestrator:
  serviceAccount:
    # create: whether the chart creates the orchestrator ServiceAccount.
    create: true
    # name: the ServiceAccount name; also used when create=false to bind
    # an existing SA.
    name: dawn-orchestrator
  # subjects: extra RoleBinding subjects (e.g. a cross-namespace SA).
  subjects: []

networkPolicy:
  # defaultDenyEgress: egress backstop (+ DNS carve-out) for Dawn-managed
  # sandbox Pods selected by app.kubernetes.io/managed-by=dawn. Helm-managed
  # reaper/control-plane Pods are excluded; sandbox network:allow is overridden.
  defaultDenyEgress: true

resourceQuota:
  enabled: true
  hard:
    requests.cpu: "8"
    requests.memory: 16Gi
    limits.cpu: "16"
    limits.memory: 32Gi
    persistentvolumeclaims: "50"
    requests.storage: 100Gi

limitRange:
  enabled: true
  # NOTE: no `pids` limit here — Kubernetes has no per-pod/namespace PID cap
  # (it's a node-level kubelet setting, `podPidsLimit`). See README.
  default:
    cpu: "1"
    memory: 512Mi
  defaultRequest:
    cpu: 100m
    memory: 128Mi
  maxEphemeralStorage: 1Gi

reaper:
  enabled: true
  schedule: "17 * * * *"
  ttlHours: 168
  # Pinned by digest (tags are mutable; the reaper SA can patch/delete PVCs).
  image: docker.io/alpine/k8s:1.35.6@sha256:b7a12c5ddf261994c33d2eaaa06fd69a0803ff6b38683bfa3d30a76dcdf92807 # sh + date + sort + grep + kubectl
