name: Published Artifact Verification

on:
  workflow_dispatch:
    inputs:
      version:
        description: npm version or dist-tag to verify
        required: true
        default: latest
      packageSet:
        description: Package set to verify
        required: true
        default: memory-pgvector-core
        type: choice
        options:
          - memory-pgvector-core
          - typescript-tooling
          - docker-sandbox
          - public
      runPgvector:
        description: Run Docker pgvector smoke
        required: true
        default: true
        type: boolean
      runOpenAI:
        description: Run real OpenAI embedding smoke
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DAWN_PACKAGE_SET: ${{ inputs.packageSet }}
      DAWN_PUBLISHED_VERSION: ${{ inputs.version }}
      DAWN_RUN_PGVECTOR: ${{ inputs.runPgvector }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.17.0
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Registry and tarball verification
        run: pnpm published:verify -- --version "$DAWN_PUBLISHED_VERSION" --package-set "$DAWN_PACKAGE_SET"

      - name: Published install/runtime smoke
        if: ${{ !inputs.runOpenAI }}
        shell: bash
        run: |
          args=(--version "$DAWN_PUBLISHED_VERSION" --package-set "$DAWN_PACKAGE_SET")
          if [ "$DAWN_RUN_PGVECTOR" = "true" ] && [ "$DAWN_PACKAGE_SET" != "typescript-tooling" ] && [ "$DAWN_PACKAGE_SET" != "docker-sandbox" ]; then
            args+=(--pgvector)
          fi
          pnpm published:smoke -- "${args[@]}"

      - name: Published install/runtime smoke with OpenAI
        if: ${{ inputs.runOpenAI }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          if [ "$DAWN_PACKAGE_SET" = "typescript-tooling" ] || [ "$DAWN_PACKAGE_SET" = "docker-sandbox" ]; then
            echo "$DAWN_PACKAGE_SET does not support the OpenAI runtime smoke" >&2
            exit 1
          fi

          if [ "$DAWN_RUN_PGVECTOR" != "true" ]; then
            echo "runOpenAI=true requires runPgvector=true" >&2
            exit 1
          fi

          if [ -z "${OPENAI_API_KEY}" ]; then
            echo "OPENAI_API_KEY secret is required when runOpenAI=true" >&2
            exit 1
          fi

          args=(--version "$DAWN_PUBLISHED_VERSION" --package-set "$DAWN_PACKAGE_SET" --pgvector --openai)
          pnpm published:smoke -- "${args[@]}"
