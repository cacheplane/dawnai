name: Published Artifact Verification

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact release version
        required: true
        type: string
      commitSha:
        description: Exact 40-character release commit SHA
        required: true
        type: string
      manifestSha256:
        description: Exact sealed manifest SHA-256
        required: true
        type: string
  schedule:
    - cron: "43 8 * * *"

permissions:
  contents: read

jobs:
  coordinate:
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' &&
        (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
          github.ref == format('refs/tags/v{0}', inputs.version)))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    outputs:
      mode: ${{ steps.route.outputs.mode }}
    steps:
      - name: Checkout trusted default-branch coordinator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0

      - name: Route exact independent audit
        id: route
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_COMMIT_SHA: ${{ inputs.commitSha }}
          INPUT_MANIFEST_SHA256: ${{ inputs.manifestSha256 }}
        run: |
          node scripts/release/independent-audit-coordinator.mjs \
            --github-output "$GITHUB_OUTPUT"

  verify-draft:
    name: verify
    needs: coordinate
    if: >-
      github.event_name == 'workflow_dispatch' &&
      needs.coordinate.outputs.mode == 'draft' &&
      github.ref == format('refs/tags/v{0}', inputs.version) &&
      github.sha == inputs.commitSha
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      attestations: read
      checks: read
      contents: read
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0

      - name: Assert exact npm runtime
        run: test "$(npm --version)" = "11.17.0"

      - name: Independently audit the exact draft release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/release/independent-audit.mjs \
            --version "${{ inputs.version }}" \
            --commit-sha "${{ inputs.commitSha }}" \
            --manifest-sha256 "${{ inputs.manifestSha256 }}" \
            --result "$RUNNER_TEMP/audit-result.json"

      - name: Upload exact audit result
        id: result
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: audit-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/audit-result.json
          if-no-files-found: error
          overwrite: false

  verify-published:
    needs: coordinate
    if: >-
      github.event_name == 'workflow_dispatch' &&
      needs.coordinate.outputs.mode == 'published' &&
      github.ref == format('refs/tags/v{0}', inputs.version) &&
      github.sha == inputs.commitSha
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      attestations: read
      checks: read
      contents: read
    steps:
      - name: Checkout exact annotated tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0

      - name: Assert exact npm runtime
        run: test "$(npm --version)" = "11.17.0"

      - name: Audit the published immutable release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/release/post-publication-audit.mjs \
            --version "${{ inputs.version }}" \
            --commit-sha "${{ inputs.commitSha }}" \
            --manifest-sha256 "${{ inputs.manifestSha256 }}" \
            --result "$RUNNER_TEMP/audit-result.json"

      - name: Upload exact post-publication audit result
        id: result
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: audit-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/audit-result.json
          if-no-files-found: error
          overwrite: false
