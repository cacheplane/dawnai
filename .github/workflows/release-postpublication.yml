name: Release Post-publication Recovery
on:
  workflow_dispatch:
    inputs:
      intent_path:
        description: Exact committed adoption intent path
        required: true
        type: string
      expected_controller_sha:
        description: Exact reviewed main controller SHA
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: dawn-release-controller
  cancel-in-progress: false
  queue: max
jobs:
  recovery-admit:
    name: recovery-admit
    needs: []
    if: github.ref == 'refs/heads/main' && inputs.expected_controller_sha == github.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
      checks: read
      attestations: read
    outputs:
      smoke: ${{ steps.prepare.outputs.smoke }}
      evidence: ${{ steps.prepare.outputs.evidence }}
      dispatch: ${{ steps.prepare.outputs.dispatch }}
      audit: ${{ steps.prepare.outputs.audit }}
      finalize: ${{ steps.prepare.outputs.finalize }}
      publish: ${{ steps.prepare.outputs.publish }}
      bootstrap_artifact_id: ${{ steps.bootstrap.outputs.artifact-id }}
    steps:
      - name: Checkout exact reviewed controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.33.0
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
      - name: Assert bundled npm
        run: test "$(npm --version)" = "11.17.0"
      - name: Install controller dependencies without lifecycles
        run: '"$PNPM_HOME/pnpm" install --filter . --frozen-lockfile --ignore-scripts'
      - name: Prepare exact committed request
        id: prepare
        env:
          GITHUB_TOKEN: ${{ github.token }}
          INPUT_EXPECTED_CONTROLLER_SHA: ${{ inputs.expected_controller_sha }}
          INPUT_INTENT_PATH: ${{ inputs.intent_path }}
        run: node scripts/release/recovery/workflow-request.mjs --command admit --output "$RUNNER_TEMP/request.json"
      - name: Transfer verified original manifest
        id: bootstrap
        if: ${{ steps.prepare.outputs.smoke == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: recovery-v2-bootstrap-${{ github.run_id }}-${{ github.run_attempt }}-${{ steps.prepare.outputs.job_id }}
          path: ${{ runner.temp }}/bootstrap/manifest.json
          if-no-files-found: error
          overwrite: false
      - name: Retain command diagnostic
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: recovery-v2-diagnostic-recovery-admit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/result.json
          if-no-files-found: ignore
          overwrite: false
  recovery-adopt:
    name: recovery-adopt
    needs:
      - recovery-admit
    if: always() && needs.recovery-admit.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
      checks: read
      attestations: read
    steps:
      - name: Checkout exact reviewed controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
