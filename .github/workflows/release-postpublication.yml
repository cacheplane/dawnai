      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.33.0
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
      - name: Assert bundled npm
        run: test "$(npm --version)" = "11.17.0"
      - name: Install controller dependencies without lifecycles
        run: '"$PNPM_HOME/pnpm" install --filter . --frozen-lockfile --ignore-scripts'
      - name: Prepare exact committed request
        id: prepare
        env:
          GITHUB_TOKEN: ${{ github.token }}
          INPUT_EXPECTED_CONTROLLER_SHA: ${{ inputs.expected_controller_sha }}
          INPUT_INTENT_PATH: ${{ inputs.intent_path }}
        run: node scripts/release/recovery/workflow-request.mjs --command adopt --output "$RUNNER_TEMP/request.json"
      - name: Execute adopt
        id: execute
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release/recovery/cli.mjs adopt --request "$RUNNER_TEMP/request.json" --output "$RUNNER_TEMP/result.json"
        if: always()
      - name: Retain command diagnostic
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: recovery-v2-diagnostic-recovery-adopt-${{ github.run_id }}-${{ github.run_attempt }}
